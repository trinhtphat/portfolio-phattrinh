<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cognac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="60%" stop-color="#1B1612"/>
      <stop offset="100%" stop-color="#0E1117"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#F5E6A3"/>
    </linearGradient>
    <linearGradient id="copper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97443"/>
      <stop offset="100%" stop-color="#8C3D19"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg-cognac)"/>
  <!-- Terroir Chalk Strata Lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1" fill="none">
    <path d="M-20 280 C 140 260, 320 310, 660 270"/>
    <path d="M-20 300 C 180 290, 360 320, 660 295"/>
    <path d="M-20 320 C 120 315, 420 330, 660 315"/>
    <path d="M-20 340 C 200 335, 460 345, 660 338"/>
  </g>
  <!-- Stylized Charentais Pot Still (Alambic) -->
  <g transform="translate(320, 160)" stroke="url(#gold-grad)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Boiler base -->
    <path d="M -70 80 C -70 45, -50 25, -28 20 L -28 -5 L 28 -5 L 28 20 C 50 25, 70 45, 70 80 Z" stroke="url(#copper-grad)" stroke-width="2.2" fill="rgba(217, 116, 67, 0.08)"/>
    <!-- Dome & Helmet (Chapiteau) -->
    <path d="M -38 -5 C -38 -45, 38 -45, 38 -5 Z" fill="rgba(229, 193, 88, 0.12)"/>
    <!-- Swan neck (Col de cygne) -->
    <path d="M 0 -45 C 0 -85, 80 -95, 110 -60 C 130 -35, 130 10, 160 30 L 190 45"/>
    <!-- Grape cluster & vine minimal motif -->
    <circle cx="-130" cy="-20" r="14" stroke="#00D2B4" stroke-width="1.5" fill="rgba(0,210,180,0.1)"/>
    <circle cx="-110" cy="-20" r="14" stroke="#00D2B4" stroke-width="1.5" fill="rgba(0,210,180,0.1)"/>
    <circle cx="-120" cy="-3" r="14" stroke="#00D2B4" stroke-width="1.5" fill="rgba(0,210,180,0.1)"/>
    <circle cx="-100" cy="-3" r="14" stroke="#00D2B4" stroke-width="1.5" fill="rgba(0,210,180,0.1)"/>
    <circle cx="-110" cy="14" r="14" stroke="#00D2B4" stroke-width="1.5" fill="rgba(0,210,180,0.1)"/>
    <path d="M -115 -20 C -120 -45, -95 -50, -85 -60" stroke="#00D2B4" stroke-width="1.5"/>
  </g>
  <!-- Editorial Badge -->
  <g transform="translate(48, 48)">
    <rect width="130" height="24" rx="12" fill="rgba(212, 175, 55, 0.12)" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1"/>
    <text x="65" y="16" fill="#E5C158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">AOC COGNAC</text>
  </g>
  <!-- Sub-label -->
  <text x="48" y="325" fill="#8E9AA8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" letter-spacing="0.5">CHARENTE TERROIR · 6 CRUS · DOUBLE DISTILLATION</text>
</svg>