<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A1A"/>
      <stop offset="60%" stop-color="#112220"/>
      <stop offset="100%" stop-color="#091113"/>
    </linearGradient>
    <linearGradient id="aqua-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0D0"/>
      <stop offset="100%" stop-color="#008774"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg-gin)"/>
  <!-- Botanical sprigs & vapor lines -->
  <g stroke="rgba(0, 240, 208, 0.08)" stroke-width="1.2" fill="none">
    <path d="M 0 100 C 180 60, 280 200, 640 120"/>
    <path d="M 0 130 C 220 90, 320 230, 640 150"/>
    <path d="M 0 160 C 200 120, 300 260, 640 180"/>
  </g>
  <!-- Juniper Berry sprigs & Botanical basket -->
  <g transform="translate(320, 180)" stroke="url(#aqua-grad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Carter-Head Vapor chamber -->
    <rect x="-40" y="-60" width="80" height="120" rx="10" stroke-width="2.2" fill="rgba(0, 135, 116, 0.1)"/>
    <line x1="-30" y1="-30" x2="30" y2="-30" stroke-dasharray="2 3" stroke-width="1.5"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke-dasharray="2 3" stroke-width="1.5"/>
    <line x1="-30" y1="30" x2="30" y2="30" stroke-dasharray="2 3" stroke-width="1.5"/>
    <!-- Vapor inflow pipe -->
    <path d="M -120 70 L -60 70 C -40 70, -40 40, -40 20"/>
    <!-- Vapor outflow to condenser -->
    <path d="M 0 -60 L 0 -85 C 0 -100, 70 -100, 90 -70 L 130 10"/>
    <!-- Juniper berries (Juniperus communis) -->
    <g transform="translate(-110, -30)" stroke="#6ED4C8" stroke-width="1.8" fill="rgba(110, 212, 200, 0.15)">
      <circle cx="0" cy="0" r="16"/>
      <path d="M -5 -5 L 5 5 M -5 5 L 5 -5" stroke-width="1.2"/>
      <circle cx="22" cy="18" r="13"/>
      <path d="M 18 14 L 26 22 M 18 22 L 26 14" stroke-width="1.2"/>
      <circle cx="-16" cy="20" r="11"/>
    </g>
    <!-- Botanical fern/sprig leaves -->
    <g transform="translate(110, 40)" stroke="#00F0D0" stroke-width="1.6">
      <path d="M 0 0 C 20 -30, 40 -50, 60 -60"/>
      <path d="M 15 -18 C 25 -22, 35 -15, 30 -5"/>
      <path d="M 30 -35 C 40 -40, 50 -32, 45 -22"/>
      <path d="M 45 -50 C 55 -55, 62 -48, 58 -38"/>
    </g>
  </g>
  <!-- Editorial Badge -->
  <g transform="translate(48, 48)">
    <rect width="145" height="24" rx="12" fill="rgba(0, 210, 180, 0.12)" stroke="rgba(0, 210, 180, 0.35)" stroke-width="1"/>
    <text x="72" y="16" fill="#00D2B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">GIN &amp; BOTANICALS</text>
  </g>
  <text x="48" y="325" fill="#8E9AA8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" letter-spacing="0.5">JUNIPERUS COMMUNIS · VAPOR INFUSION · LONDON DRY STANDARD</text>
</svg>