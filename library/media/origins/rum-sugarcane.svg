<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-rum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191512"/>
      <stop offset="60%" stop-color="#241B12"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </linearGradient>
    <linearGradient id="amber-rum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B041"/>
      <stop offset="50%" stop-color="#D35400"/>
      <stop offset="100%" stop-color="#7E2800"/>
    </linearGradient>
    <linearGradient id="cane-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82E0AA"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg-rum)"/>
  <!-- Tropical contour waves & Coral filtered water table -->
  <g stroke="rgba(245, 176, 65, 0.08)" stroke-width="1.2" fill="none">
    <path d="M -20 260 C 160 230, 340 290, 660 250"/>
    <path d="M -20 285 C 180 260, 380 310, 660 280"/>
    <path d="M -20 310 C 140 290, 420 330, 660 305"/>
  </g>
  <!-- Stylized Sugarcane Stalks & Double-Retort Pot Still -->
  <g transform="translate(320, 180)">
    <!-- Sugarcane Stalks on left -->
    <g transform="translate(-130, 0)" stroke="url(#cane-green)" stroke-width="2.5" fill="none" stroke-linecap="round">
      <!-- Stalk 1 -->
      <line x1="-15" y1="-80" x2="-15" y2="80"/>
      <line x1="-22" y1="-40" x2="-8" y2="-40" stroke-width="2"/>
      <line x1="-22" y1="0" x2="-8" y2="0" stroke-width="2"/>
      <line x1="-22" y1="40" x2="-8" y2="40" stroke-width="2"/>
      <path d="M -15 -40 C -35 -60, -45 -50, -55 -45" stroke-width="1.5"/>
      <!-- Stalk 2 -->
      <line x1="15" y1="-95" x2="15" y2="80"/>
      <line x1="8" y1="-50" x2="22" y2="-50" stroke-width="2"/>
      <line x1="8" y1="-10" x2="22" y2="-10" stroke-width="2"/>
      <line x1="8" y1="30" x2="22" y2="30" stroke-width="2"/>
      <path d="M 15 -50 C 35 -75, 45 -65, 60 -60" stroke-width="1.5"/>
    </g>
    <!-- Double-Retort Pot Still on right -->
    <g transform="translate(60, 10)" stroke="url(#amber-rum)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main copper kettle -->
      <path d="M -60 50 C -60 25, -45 10, -25 5 L -25 -15 C -25 -30, 25 -30, 25 -15 L 25 5 C 45 10, 60 25, 60 50 Z" stroke-width="2.2" fill="rgba(211, 84, 0, 0.1)"/>
      <!-- Swan neck to retort 1 -->
      <path d="M 0 -30 C 0 -55, 60 -55, 75 -35 L 75 10"/>
      <!-- Retort 1 vessel -->
      <rect x="60" y="10" width="30" height="40" rx="6" fill="rgba(245, 176, 65, 0.08)"/>
      <!-- Pipe to retort 2 -->
      <path d="M 75 10 C 75 -10, 110 -10, 115 15 L 115 25"/>
      <!-- Retort 2 vessel -->
      <rect x="105" y="25" width="22" height="25" rx="4" fill="rgba(245, 176, 65, 0.08)"/>
    </g>
  </g>
  <!-- Editorial Badge -->
  <g transform="translate(48, 48)">
    <rect width="165" height="24" rx="12" fill="rgba(245, 176, 65, 0.12)" stroke="rgba(245, 176, 65, 0.35)" stroke-width="1"/>
    <text x="82" y="16" fill="#F5B041" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">BARBADOS RUM 1703</text>
  </g>
  <text x="48" y="325" fill="#8E9AA8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" letter-spacing="0.5">SUGARCANE · CORAL WATER · POT-AND-COLUMN BLENDING</text>
</svg>